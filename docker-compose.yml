# 本地开发专用 MySQL。生产环境请使用 docker-compose.prod.yml。
services:
  mysql:
    image: mysql:8.4
    container_name: qanda-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qanda
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - qanda_dev_mysql_data:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+08:00"

volumes:
  qanda_dev_mysql_data:
